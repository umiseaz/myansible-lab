---
# Connection settings
ansible_connection: network_cli
ansible_user: admin
ansible_password: admin
ansible_network_os: cisco.ios.ios
ansible_become: true
ansible_become_method: enable

# ==============================================================================
# SSH Workaround for GNS3 IOU
# ==============================================================================
# Forces Ansible to use libssh and respect the legacy crypto settings
# defined in /home/khau/.ssh/config (e.g., diffie-hellman-group14-sha1, ssh-rsa)
ansible_network_cli_ssh_type: libssh
ansible_ssh_extra_args: "-F /home/khau/.ssh/config"

ntp:
  servers:
    - 10.1.1.254
  source: Ethernet1/3

syslog:
  servers:
    - 10.1.1.254
  source: Ethernet1/3
  facility: local6

ospf_auth:
  key_id: 1
  key: "ospf@lab123"

ospf_reference_bandwidth: 100
