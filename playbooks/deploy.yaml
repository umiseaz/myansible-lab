---
- name: Deploy MPLS L3VPN configs to devices
  hosts: all
  gather_facts: no
  tasks:
    - name: Show resolved config path
      debug:
        msg: "Looking for: {{ playbook_dir }}/../rendered/{{ inventory_hostname | lower }}.cfg"

    - name: Check if rendered config file exists
      delegate_to: localhost
      stat:
        path: "{{ playbook_dir }}/../rendered/{{ inventory_hostname | lower }}.cfg"
      register: cfg_file_check

    - name: Show file check result
      debug:
        msg: "File exists: {{ cfg_file_check.stat.exists }} — path: {{ cfg_file_check.stat.path | default('N/A') }}"

    - name: Push rendered config to device
      cisco.ios.ios_config:
        src: "{{ playbook_dir }}/../rendered/{{ inventory_hostname | lower }}.cfg"
      register: config_result
      retries: 2
      delay: 5
      until: config_result is not failed

    - name: Show if config changed
      debug:
        msg: "{{ inventory_hostname }}: {{ 'CHANGED' if config_result.changed else 'NO CHANGE' }}"