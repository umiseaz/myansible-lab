---
- name: Render MPLS L3VPN configs
  hosts: all
  connection: local
  gather_facts: no

  tasks:
    - name: Ensure rendered directory exists
      file:
        path: "{{ playbook_dir }}/../rendered"
        state: directory
      run_once: true

    - name: Render master.j2 template
      template:
        src: "{{ playbook_dir }}/../templates/master.j2"
        dest: "{{ playbook_dir }}/../rendered/{{ inventory_hostname | lower }}.cfg"
        lstrip_blocks: true