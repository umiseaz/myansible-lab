hostname CE2
ip domain-name lab.local
!
ip cef
!
username admin privilege 15 secret admin
ip ssh version 2
crypto key generate rsa general-keys modulus 2048
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
interface Ethernet1/3
 description OOB Management
 vrf forwarding Mgmt-intf
 ip address 10.1.1.8 255.255.255.0
 no shutdown
!
ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 10.1.1.254
!
line vty 0 4
 login local
 transport input ssh
!
ntp server 10.1.1.254 source Ethernet1/3
!
logging source-interface Ethernet1/3 vrf Mgmt-intf
logging facility local6
logging host 10.1.1.254 vrf Mgmt-intf
!

interface Loopback0
 description Router ID
 ip address 88.88.88.88 255.255.255.255
 no shutdown
!
interface Ethernet1/0
 description link to PE2
 ip address 172.1.48.8 255.255.255.0
 no shutdown
!



ip prefix-list PE2-PREFIXES seq 10 permit 0.0.0.0/0 le 32
!

route-map PE2-IN permit 10
 description Accept routes from PE2
 match ip address prefix-list PE2-PREFIXES
!
route-map PE2-OUT permit 999
 description Advertise CE2 prefixes to PE2
!

router bgp 65001
 bgp router-id 88.88.88.88
 bgp log-neighbor-changes
!
 neighbor 172.1.48.4 remote-as 65
 neighbor 172.1.48.4 description PE2
!
 address-family ipv4
  network 88.88.88.88 mask 255.255.255.255
  neighbor 172.1.48.4 activate
  neighbor 172.1.48.4 route-map PE2-IN in
  neighbor 172.1.48.4 route-map PE2-OUT out
  no auto-summary
 exit-address-family
!