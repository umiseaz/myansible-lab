hostname CE4
ip domain-name lab.local
!
ip cef
!
username admin privilege 15 secret admin
ip ssh version 2
crypto key generate rsa general-keys modulus 2048
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
interface Ethernet1/3
 description OOB Management
 vrf forwarding Mgmt-intf
 ip address 10.1.1.10 255.255.255.0
 no shutdown
!
ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 10.1.1.254
!
line vty 0 4
 login local
 transport input ssh
!
ntp server 10.1.1.254 source Ethernet1/3
!
logging source-interface Ethernet1/3 vrf Mgmt-intf
logging facility local6
logging host 10.1.1.254 vrf Mgmt-intf
!

interface Loopback0
 description Router ID
 ip address 100.100.100.100 255.255.255.255
 no shutdown
!
interface Ethernet1/0
 description link to PE1
 ip address 172.4.10.10 255.255.255.0
 no shutdown
!



ip prefix-list PE1-PREFIXES seq 10 permit 0.0.0.0/0 le 32
!

route-map PE1-IN permit 10
 description Accept routes from PE1
 match ip address prefix-list PE1-PREFIXES
!
route-map PE1-OUT permit 999
 description Advertise CE4 prefixes to PE1
!

router bgp 65002
 bgp router-id 100.100.100.100
 bgp log-neighbor-changes
!
 neighbor 172.4.10.4 remote-as 65
 neighbor 172.4.10.4 description PE1
!
 address-family ipv4
  network 100.100.100.100 mask 255.255.255.255
  neighbor 172.4.10.4 activate
  neighbor 172.4.10.4 route-map PE1-IN in
  neighbor 172.4.10.4 route-map PE1-OUT out
  no auto-summary
 exit-address-family
!