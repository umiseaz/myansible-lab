hostname PE1
ip domain-name lab.local
!
ip cef
!
username admin privilege 15 secret admin
ip ssh version 2
crypto key generate rsa general-keys modulus 2048
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
interface Ethernet1/3
 description OOB Management
 vrf forwarding Mgmt-intf
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 10.1.1.254
!
line vty 0 4
 login local
 transport input ssh
!
ntp server 10.1.1.254 source Ethernet1/3
!
logging source-interface Ethernet1/3 vrf Mgmt-intf
logging facility local6
logging host 10.1.1.254 vrf Mgmt-intf
!
vrf definition VRF_A
 rd 65:65001
 route-target export 65:65001
 route-target import 65:65001
 address-family ipv4
 exit-address-family
 !
vrf definition VRF_B
 rd 65:65002
 route-target export 65:65002
 route-target import 65:65002
 address-family ipv4
 exit-address-family
 !
!
interface Loopback0
 description Router ID
 ip address 1.1.1.1 255.255.255.255
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/0
 description link to P1
 ip address 10.1.2.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ospf@lab123
 mpls ip
 no shutdown
!
interface Ethernet1/0
 description VRF A to CE1
 vrf forwarding VRF_A
 ip address 172.1.17.1 255.255.255.0
 no shutdown
!
interface Ethernet1/1
 description VRF B to CE3
 vrf forwarding VRF_B
 ip address 172.1.9.1 255.255.255.0
 no shutdown
!

router ospf 1
 router-id 1.1.1.1
 auto-cost reference-bandwidth 100
 passive-interface Loopback0
!
mpls ip
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
router bgp 65
 template peer-policy rr-peers-ipv4
  next-hop-self
  send-community both
 exit-peer-policy
 template peer-policy rr-peers-vpnv4
  next-hop-self
  send-community both
 exit-peer-policy
!
 template peer-session rr-peers
  remote-as 65
  description RR Peers
  password cisco
  update-source Loopback0
  timers 30 90
  fall-over
 exit-peer-session
!
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 bgp graceful-restart restart-time 120
 bgp graceful-restart stalepath-time 360
 bgp graceful-restart
!
 neighbor 5.5.5.5 inherit peer-session rr-peers
 neighbor 5.5.5.5 description RR1
 neighbor 6.6.6.6 inherit peer-session rr-peers
 neighbor 6.6.6.6 description RR2
!
 address-family ipv4
  no synchronization
  neighbor 5.5.5.5 activate
  neighbor 5.5.5.5 inherit peer-policy rr-peers-ipv4
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 inherit peer-policy rr-peers-ipv4
  no auto-summary
 exit-address-family
!
address-family vpnv4
  neighbor 5.5.5.5 activate
  neighbor 5.5.5.5 send-community extended
  neighbor 5.5.5.5 inherit peer-policy rr-peers-vpnv4
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 send-community extended
  neighbor 6.6.6.6 inherit peer-policy rr-peers-vpnv4
 exit-address-family
!
address-family ipv4 vrf VRF_A
  redistribute connected
  neighbor 172.1.17.7 remote-as 65001
  neighbor 172.1.17.7 activate
  neighbor 172.1.17.7 description CE1
  neighbor 172.1.17.7 as-override
  neighbor 172.1.17.7 route-map CE1-IN in
  neighbor 172.1.17.7 route-map CE1-OUT out
  no synchronization
exit-address-family
!
address-family ipv4 vrf VRF_B
  redistribute connected
  neighbor 172.1.9.9 remote-as 65002
  neighbor 172.1.9.9 activate
  neighbor 172.1.9.9 description CE3
  neighbor 172.1.9.9 as-override
  neighbor 172.1.9.9 route-map CE3-IN in
  neighbor 172.1.9.9 route-map CE3-OUT out
  no synchronization
exit-address-family
!
!
ip prefix-list CE1-PREFIXES seq 10 permit 77.77.77.77/32
ip prefix-list CE1-PREFIXES seq 20 permit 172.1.17.0/24
!
ip prefix-list CE3-PREFIXES seq 10 permit 99.99.99.99/32
ip prefix-list CE3-PREFIXES seq 20 permit 172.1.9.0/24
!

route-map CE1-IN permit 10
 description Accept CE1 prefixes
 match ip address prefix-list CE1-PREFIXES
!
route-map CE3-IN permit 10
 description Accept CE3 prefixes
 match ip address prefix-list CE3-PREFIXES
!
route-map CE1-OUT permit 999
 description Advertise VRF_A routes to CE1
!
route-map CE3-OUT permit 999
 description Advertise VRF_B routes to CE3
!

