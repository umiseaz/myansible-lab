hostname RR1
ip domain-name lab.local
!
ip cef
!
username admin privilege 15 secret admin
ip ssh version 2
crypto key generate rsa general-keys modulus 2048
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
interface Ethernet1/3
 description OOB Management
 vrf forwarding Mgmt-intf
 ip address 10.1.1.5 255.255.255.0
 no shutdown
!
ip route vrf Mgmt-intf 0.0.0.0 0.0.0.0 10.1.1.254
!
line vty 0 4
 login local
 transport input ssh
!
ntp server 10.1.1.254 source Ethernet1/3
!
logging source-interface Ethernet1/3 vrf Mgmt-intf
logging facility local6
logging host 10.1.1.254 vrf Mgmt-intf
!

interface Loopback0
 description Router ID
 ip address 5.5.5.5 255.255.255.255
 ip ospf 1 area 0
 no shutdown
!
interface Ethernet0/2
 description link to P1
 ip address 10.2.5.5 255.255.255.0
 ip ospf network point-to-point
 ip ospf 1 area 0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ospf@lab123
 mpls ip
 no shutdown
!

router ospf 1
 router-id 5.5.5.5
 auto-cost reference-bandwidth 100
 passive-interface Loopback0
!
mpls ip
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
router bgp 65
 template peer-policy edge-rr-clients-ipv4
  send-community both
  route-reflector-client
 exit-peer-policy
 template peer-policy edge-rr-clients-vpnv4
  send-community both
  route-reflector-client
 exit-peer-policy
 template peer-policy core-rr-clients-ipv4
  send-community both
  route-reflector-client
 exit-peer-policy
 template peer-policy rr-other-ipv4
  send-community both
 exit-peer-policy
 template peer-policy rr-other-vpnv4
  send-community both
 exit-peer-policy
!
 template peer-session edge-rr-clients
  remote-as 65
  description Edge RR Clients
  password cisco
  update-source Loopback0
  timers 30 90
  fall-over
 exit-peer-session
 template peer-session core-rr-clients
  remote-as 65
  description Core RR Clients
  password cisco
  update-source Loopback0
  timers 30 90
  fall-over
 exit-peer-session
 template peer-session rr-other
  remote-as 65
  description Other RR Clients
  password cisco
  update-source Loopback0
  timers 30 90
  fall-over
 exit-peer-session
!
 bgp router-id 5.5.5.5
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 bgp graceful-restart restart-time 120
 bgp graceful-restart stalepath-time 360
 bgp graceful-restart
!
 neighbor 1.1.1.1 inherit peer-session edge-rr-clients
 neighbor 1.1.1.1 description PE1
 neighbor 4.4.4.4 inherit peer-session edge-rr-clients
 neighbor 4.4.4.4 description PE2
 neighbor 2.2.2.2 inherit peer-session core-rr-clients
 neighbor 2.2.2.2 description P1
 neighbor 3.3.3.3 inherit peer-session core-rr-clients
 neighbor 3.3.3.3 description P2
 neighbor 6.6.6.6 inherit peer-session rr-other
 neighbor 6.6.6.6 description RR2
!
 address-family ipv4
  no synchronization
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 inherit peer-policy edge-rr-clients-ipv4
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 inherit peer-policy edge-rr-clients-ipv4
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 inherit peer-policy core-rr-clients-ipv4
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 inherit peer-policy core-rr-clients-ipv4
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 inherit peer-policy rr-other-ipv4
  no auto-summary
 exit-address-family
!
address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
  neighbor 1.1.1.1 inherit peer-policy edge-rr-clients-vpnv4
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 send-community extended
  neighbor 4.4.4.4 inherit peer-policy edge-rr-clients-vpnv4
  neighbor 6.6.6.6 activate
  neighbor 6.6.6.6 send-community extended
  neighbor 6.6.6.6 inherit peer-policy rr-other-vpnv4
 exit-address-family
!



